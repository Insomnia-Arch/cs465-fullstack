<div>
  <button (click)="addTrip()" class="btn btn-info">Add Trip</button>
</div>

<p>{{ message() }}</p>

<div class="row">
  @for (trip of trips(); track trip.code) {
    <div class="col-md-4">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  } @empty {
    <p>No trips found.</p>
  }
</div>
